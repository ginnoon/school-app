  <script>
    const CONFIG = {
      NEIS_URL: 'https://open.neis.go.kr/hub/mealServiceDietInfo',
      ATPT_CODE: 'C10',
      SCHUL_CODE: '7150118',
      NO_MEAL_TEXT: '<span class="text-xs text-gray-400">급식 정보가 없습니다.</span>',
      NO_CAL_TEXT: '- Kcal',
      SKELETON_HTML: `
        <div class="animate-pulse space-y-2 py-1">
          <div class="h-3.5 bg-gray-200 rounded w-5/6"></div>
          <div class="h-3.5 bg-gray-200 rounded w-3/4"></div>
          <div class="h-3.5 bg-gray-200 rounded w-4/6"></div>
        </div>
      `,
      LOCATIONS: [
        { name: '서울', lat: 37.5665, lon: 126.9780 },
        { name: '인천', lat: 37.4563, lon: 126.7052 },
        { name: '수원', lat: 37.2636, lon: 127.0286 },
        { name: '대전', lat: 36.3504, lon: 127.3845 },
        { name: '광주', lat: 35.1595, lon: 126.8526 },
        { name: '대구', lat: 35.8714, lon: 128.6014 },
        { name: '부산', lat: 35.1796, lon: 129.0756 },
        { name: '제주', lat: 33.4996, lon: 126.5312 }
      ]
    };
    const CLEAN_REGEX = /\s*\(.*?\)\s*|[0-9.]+\s*$/g;

    const State = {
      currentDate: new Date(),
      cachedMeals: new Map(),
      abortController: null,
      currentLocIndex: parseInt(localStorage.getItem('weatherLocIndex')) || 0,
      weatherData: null
    };

    const DOM = {};

    const UIService = {
      initDOM() {
        ['view-menu', 'view-meal', 'view-timetable', 'view-weather', 'm', 'n', 'm-cal', 'n-cal', 'date-display', 'toast', 'toast-card', 'toast-msg', 'menu-today-precip', 'menu-today-label', 'weather-location', 'weather-list'].forEach(id => {
          DOM[id.replace(/-([a-z])/g, g => g[1].toUpperCase())] = document.getElementById(id);
        });
        DOM.timetableBody = document.querySelector('#timetable-grid tbody');
      },
      showToast(message, type = 'info') {
        DOM.toastMsg.textContent = message;
        const typeClasses = {
          success: 'bg-emerald-700', error: 'bg-rose-700', warning: 'bg-amber-700', info: 'bg-gray-800'
        };
        DOM.toastCard.className = `px-4 py-2.5 rounded-lg shadow-lg text-xs font-medium text-white flex items-center gap-2 max-w-xs text-center ${typeClasses[type] || typeClasses.info}`;
        DOM.toast.classList.replace('opacity-0', 'opacity-100');
        DOM.toast.classList.replace('translate-y-4', 'translate-y-0');
        DOM.toast.classList.remove('pointer-events-none');
        clearTimeout(this.toastTimeout);
        this.toastTimeout = setTimeout(() => {
          DOM.toast.classList.replace('opacity-100', 'opacity-0');
          DOM.toast.classList.replace('translate-y-0', 'translate-y-4');
          DOM.toast.classList.add('pointer-events-none');
        }, 2600);
      },
      navigate(viewName) {
        ['viewMenu', 'viewMeal', 'viewTimetable', 'viewWeather'].forEach(view => {
          DOM[view].classList.add(view === 'viewMenu' ? '-translate-x-full' : 'translate-x-full');
          DOM[view].classList.remove('translate-x-0');
        });
        const targetView = 'view' + viewName.charAt(0).toUpperCase() + viewName.slice(1);
        if (DOM[targetView]) {
          DOM[targetView].classList.replace(targetView === 'viewMenu' ? '-translate-x-full' : 'translate-x-full', 'translate-x-0');
        }
      }
    };

    const MealService = {
      formatDateStr: (d) => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`,
      renderDate() {
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        DOM.dateDisplay.textContent = `${State.currentDate.getMonth() + 1}.${State.currentDate.getDate()} (${days[State.currentDate.getDay()]})`;
      },
      changeDate(offset, reset = false) {
        State.currentDate = reset ? new Date() : new Date(State.currentDate.setDate(State.currentDate.getDate() + offset));
        this.renderDate();
        this.fetchMealData(State.currentDate);
      },
      displayMeal(data) {
        DOM.m.innerHTML = data ? data.m.menu : CONFIG.NO_MEAL_TEXT;
        DOM.n.innerHTML = data ? data.n.menu : CONFIG.NO_MEAL_TEXT;
        DOM.mCal.textContent = data ? data.m.cal : CONFIG.NO_CAL_TEXT;
        DOM.nCal.textContent = data ? data.n.cal : CONFIG.NO_CAL_TEXT;
      },
      async fetchMealData(dateObj) {
        const targetDate = this.formatDateStr(dateObj);
        DOM.m.innerHTML = DOM.n.innerHTML = CONFIG.SKELETON_HTML;
        DOM.mCal.textContent = DOM.nCal.textContent = '- Kcal';

        if (State.cachedMeals.has(targetDate)) return this.displayMeal(State.cachedMeals.get(targetDate));

        if (State.abortController) State.abortController.abort();
        State.abortController = new AbortController();

        const fromDate = this.formatDateStr(new Date(dateObj.getTime() - 86400000));
        const toDate = this.formatDateStr(new Date(dateObj.getTime() + 86400000));
        const url = `${CONFIG.NEIS_URL}?ATPT_OFCDC_SC_CODE=${CONFIG.ATPT_CODE}&SD_SCHUL_CODE=${CONFIG.SCHUL_CODE}&MLSV_FROM_YMD=${fromDate}&MLSV_TO_YMD=${toDate}&pSize=100&Type=json`;

        try {
          const res = await fetch(url, { signal: State.abortController.signal });
          const json = await res.json();
          const defaultEmpty = () => ({ m: { menu: CONFIG.NO_MEAL_TEXT, cal: CONFIG.NO_CAL_TEXT }, n: { menu: CONFIG.NO_MEAL_TEXT, cal: CONFIG.NO_CAL_TEXT } });

          [fromDate, targetDate, toDate].forEach(d => { if (!State.cachedMeals.has(d)) State.cachedMeals.set(d, defaultEmpty()); });

          json.mealServiceDietInfo?.[1]?.row?.forEach(row => {
            const dataObj = State.cachedMeals.get(row.MLSV_YMD);
            if (!dataObj) return;
            const menu = row.DDISH_NM.split('<br/>').map(l => l.replace(CLEAN_REGEX, '').trim()).filter(Boolean).join('<br>') || CONFIG.NO_MEAL_TEXT;
            const cal = row.CAL_INFO.trim() || CONFIG.NO_CAL_TEXT;
            if (['2', '중식'].some(k => row.MMEAL_SC_CODE === k || row.MMEAL_SC_NM.includes(k))) { dataObj.m = { menu, cal }; }
            if (['3', '석식'].some(k => row.MMEAL_SC_CODE === k || row.MMEAL_SC_NM.includes(k))) { dataObj.n = { menu, cal }; }
          });
          this.displayMeal(State.cachedMeals.get(targetDate));
        } catch (e) {
          if (e.name !== 'AbortError') {
            const errHtml = '<span class="text-xs text-rose-500 font-medium">데이터를 불러오지 못했습니다.</span>';
            DOM.m.innerHTML = DOM.n.innerHTML = errHtml;
          }
        }
      }
    };

    const TimetableService = {
      init() {
        const html = localStorage.getItem('myTimetable');
        if (html) DOM.timetableBody.innerHTML = html;
      },
      async importFromClipboard() {
        try {
          if (!navigator.clipboard?.read) throw new Error('Not supported');
          const items = await navigator.clipboard.read();
          for (const item of items) {
            if (item.types.includes('text/html')) {
              this.processPastedHTML(await (await item.getType('text/html')).text());
              return;
            }
          }
          UIService.showToast('복사된 표(HTML) 데이터가 없습니다.', 'warning');
        } catch (e) {
          UIService.showToast('클립보드 접근에 실패했습니다.', 'error');
        }
      },
      processPastedHTML(html) {
        const table = new DOMParser().parseFromString(html, "text/html").querySelector("table");
        if (!table) return UIService.showToast("표 구조를 찾지 못했습니다.", "warning");

        const rows = Array.from(table.querySelectorAll("tr")).filter(tr => tr.querySelector("th, td"));
        if (!rows.length) return;

        const startIndex = rows[0].querySelector("th") ? 1 : 0;
        const tbody = document.createElement("tbody");

        rows.slice(startIndex).forEach(row => {
          const newRow = document.createElement("tr");
          Array.from(row.querySelectorAll("th, td")).slice(0, 6).forEach((cell, j) => {
            const isHead = j === 0;
            const newCell = document.createElement(isHead ? "th" : "td");
            newCell.className = isHead
              ? "bg-gray-50 border-b border-r border-gray-200 p-1.5 font-medium text-gray-600 sticky left-0 z-10"
              : "border-b border-r border-gray-200 p-1.5 bg-white text-gray-800 font-medium text-[11px]";
            if (isHead) newCell.setAttribute("scope", "row");

            this.copyCellContent(cell, newCell);
            newRow.appendChild(newCell);
          });
          tbody.appendChild(newRow);
        });

        DOM.timetableBody.innerHTML = tbody.innerHTML;
        localStorage.setItem('myTimetable', tbody.innerHTML);
        UIService.showToast("시간표가 등록되었습니다.", "success");
      },
      copyCellContent(source, target) {
        Array.from(source.childNodes).forEach(child => {
          if (child.nodeType === Node.TEXT_NODE) target.appendChild(document.createTextNode(child.nodeValue));
          else if (child.nodeType === Node.ELEMENT_NODE) {
            const tag = child.tagName.toLowerCase();
            if (new Set(["br", "span", "b", "strong", "i", "em"]).has(tag)) {
              const newEl = document.createElement(tag);
              Array.from(child.childNodes).forEach(n => newEl.appendChild(n.cloneNode(true)));
              target.appendChild(newEl);
            } else {
              Array.from(child.childNodes).forEach(n => target.appendChild(n.cloneNode(true)));
            }
          }
        });
        // 최상위 target(td, th)의 속성은 삭제하지 않도록 isRoot=true 전달
        this.cleanElement(target, true);
      },
      cleanElement(element, isRoot = false) {
        if (!isRoot) {
          const attrs = element.attributes;
          for (let i = attrs.length - 1; i >= 0; i--) {
            element.removeAttribute(attrs[i].name);
          }
          if (element.tagName.toLowerCase() === 'span') element.className = 'tch';
        }
        Array.from(element.children).forEach(c => this.cleanElement(c, false));
      }
    };
    const WeatherService = {
      init() {
        CONFIG.LOCATIONS.forEach((loc, i) => DOM.weatherLocation.add(new Option(loc.name, i)));
        DOM.weatherLocation.value = State.currentLocIndex;
        this.fetchWeatherData();
      },
      async fetchWeatherData() {
        const { lat, lon } = CONFIG.LOCATIONS[State.currentLocIndex];
        DOM.menuTodayPrecip.textContent = '...';
        if (DOM.menuTodayLabel) DOM.menuTodayLabel.textContent = '오늘';
        DOM.weatherList.innerHTML = '<div class="text-center text-sm text-gray-500 py-10 animate-pulse">로딩 중...</div>';
        try {
          const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=precipitation_probability&daily=precipitation_probability_max,weather_code&timezone=Asia%2FSeoul`);
          State.weatherData = await res.json();
          this.updateUI();
        } catch {
          DOM.menuTodayPrecip.textContent = '- %';
          if (DOM.menuTodayLabel) DOM.menuTodayLabel.textContent = '오늘';
          DOM.weatherList.innerHTML = '<div class="text-center text-sm text-rose-500 py-10">날씨 정보를 불러오지 못했습니다.</div>';
        }
      },
      updateUI() {
        const { daily, hourly } = State.weatherData || {};
        if (!daily) return;

        const now = new Date();
        const currentHourStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}T${String(now.getHours()).padStart(2, '0')}:00`;

        let todayPrecip = daily.precipitation_probability_max[0];
        if (hourly?.time) {
          const remaining = hourly.precipitation_probability.filter((p, i) => hourly.time[i] >= currentHourStr && hourly.time[i].startsWith(currentHourStr.split('T')[0]));
          if (remaining.length) todayPrecip = Math.max(...remaining);
        }

        DOM.menuTodayPrecip.textContent = `${todayPrecip}%`;
        const days = ['일', '월', '화', '수', '목', '금', '토'];

        // WMO 날씨 코드별 이모지 매핑
        const WMO_EMOJI = {
          0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
          45: '🌫️', 48: '🌫️',
          51: '🌧️', 53: '🌧️', 55: '🌧️', 56: '🌧️', 57: '🌧️',
          61: '🌧️', 63: '🌧️', 65: '🌧️', 66: '🌧️', 67: '🌧️',
          71: '❄️', 73: '❄️', 75: '❄️', 77: '❄️',
          80: '🌦️', 81: '🌧️', 82: '🌧️',
          85: '🌨️', 86: '🌨️',
          95: '🌩️', 96: '⛈️', 99: '⛈️'
        };

        if (DOM.menuTodayLabel) {
          const todayEmoji = WMO_EMOJI[daily.weather_code[0]] || '☁️';
          DOM.menuTodayLabel.textContent = `오늘 ${todayEmoji}`;
        }

        DOM.weatherList.innerHTML = daily.time.map((dStr, i) => {
          const d = new Date(dStr + 'T00:00:00');
          const isToday = i === 0;
          const p = isToday ? todayPrecip : daily.precipitation_probability_max[i];
          const color = p > 50 ? 'bg-blue-500' : p > 0 ? 'bg-blue-300' : 'bg-blue-100';
          const text = p > 50 ? 'text-blue-600' : 'text-gray-700';
          const emoji = WMO_EMOJI[daily.weather_code[i]] || '☁️';

          return `
            <div class="flex items-center gap-4 bg-white border border-gray-100 rounded-lg p-3 shadow-sm">
              <div class="w-[4.5rem] shrink-0 text-center">
                <div class="text-[11px] text-gray-500 font-medium">${d.getMonth() + 1}.${d.getDate()}</div>
                <div class="text-sm font-bold ${isToday ? 'text-blue-600' : 'text-gray-800'} whitespace-nowrap">${isToday ? '오늘' : days[d.getDay()]} ${emoji}</div>
              </div>
              <div class="flex-1">
                <div class="h-3 w-full bg-gray-100 rounded-full overflow-hidden">
                  <div class="h-full ${color} rounded-full" style="width: ${p}%"></div>
                </div>
              </div>
              <div class="w-12 shrink-0 text-right"><span class="text-base font-bold ${text}">${p}%</span></div>
            </div>
          `;
        }).join('');
      },
      changeLocation() {
        State.currentLocIndex = DOM.weatherLocation.value;
        localStorage.setItem('weatherLocIndex', State.currentLocIndex);
        this.fetchWeatherData();
      }
    };

    window.addEventListener('offline', () => {
      UIService.showToast('인터넷에 연결되어 있지 않습니다.', 'warning');
    });

    if (!navigator.onLine) {
      UIService.showToast('인터넷에 연결되어 있지 않습니다.', 'warning');
    }

    window.onload = () => {
      UIService.initDOM();
      WeatherService.init();
      TimetableService.init();
      MealService.changeDate(0, true);
    };
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log("서비스 워커 등록"))
        .catch(err => console.log("등록 실패:", err));
    }
  </script>
</body>
