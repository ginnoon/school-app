<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ginnoon's school app</title>
  <link rel="icon" type="image/png" href="icon-32.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen flex items-center justify-center p-4">
  <main class="w-full max-w-sm bg-white rounded-xl border border-gray-200 p-5 space-y-5 shadow-sm">
    <section class="flex flex-col items-center gap-2 pb-1 border-b border-gray-100">
      <div class="flex items-center justify-between w-full">
        <button onclick="changeDate(-1)"
          class="w-8 h-8 rounded-md border border-gray-200 hover:bg-gray-50 text-gray-600 flex items-center justify-center transition-colors text-sm"
          aria-label="어제">
          &#10094;
        </button>
        <div class="text-center">
          <span id="dateDisplay" class="text-base font-semibold text-gray-900">----.--.--</span>
          <span id="dayOfWeek" class="text-xs font-medium text-gray-500 ml-1">(--)</span>
        </div>
        <button onclick="changeDate(1)"
          class="w-8 h-8 rounded-md border border-gray-200 hover:bg-gray-50 text-gray-600 flex items-center justify-center transition-colors text-sm"
          aria-label="내일">
          &#10095;
        </button>
      </div>
      <button onclick="goToday()"
        class="text-xs text-gray-500 hover:text-gray-800 underline underline-offset-2 transition-colors py-0.5">
        오늘로 이동
      </button>
    </section>
    <section class="space-y-4">
      <div class="border border-gray-100 rounded-lg p-4 bg-gray-50/50">
        <div class="flex items-center justify-between pb-2 mb-2 border-b border-gray-200/60">
          <h2 class="font-bold text-gray-800 text-sm">중식</h2>
          <span id="cal-lunch" class="text-xs text-gray-500 font-normal"></span>
        </div>
        <div id="m" class="text-sm text-gray-700 leading-relaxed min-h-[110px]">
        </div>
      </div>
      <div class="border border-gray-100 rounded-lg p-4 bg-gray-50/50">
        <div class="flex items-center justify-between pb-2 mb-2 border-b border-gray-200/60">
          <h2 class="font-bold text-gray-800 text-sm">석식</h2>
          <span id="cal-dinner" class="text-xs text-gray-500 font-normal"></span>
        </div>
        <div id="n" class="text-sm text-gray-700 leading-relaxed min-h-[110px]">
        </div>
      </div>
    </section>
  </main>
  <script>
    let currentDate = new Date();
    const mealCache = new Map();
    let currentAbortController = null;
    const ALLERGEN_REGEX = /\s*\([\d\.]+\)|\s*[\d\.]+\.?\s*$/g;
    const BR_SPLIT_REGEX = /<br\s*\/?>|\n/gi;
    let DOM = {};
    function getYYYYMMDD(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}${m}${d}`;
    }
    function getOffsetDate(dateObj, offsetDays) {
      const d = new Date(dateObj);
      d.setDate(d.getDate() + offsetDays);
      return d;
    }
    function getSkeletonHTML() {
      return `
                <div class="animate-pulse space-y-2 py-1">
                    <div class="h-3.5 bg-gray-200 rounded w-5/6"></div>
                    <div class="h-3.5 bg-gray-200 rounded w-3/4"></div>
                    <div class="h-3.5 bg-gray-200 rounded w-4/6"></div>
                    <div class="h-3.5 bg-gray-200 rounded w-1/2"></div>
                </div>
            `;
    }
    function updateDateUI() {
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      const day = String(currentDate.getDate()).padStart(2, '0');
      const dayIdx = currentDate.getDay();
      DOM.dateDisplay.innerText = `${year}.${month}.${day}`;
      DOM.dayOfWeek.innerText = `(${days[dayIdx]})`;
      if (dayIdx === 0) {
        DOM.dayOfWeek.className = "text-xs font-medium text-red-500 ml-1";
      } else if (dayIdx === 6) {
        DOM.dayOfWeek.className = "text-xs font-medium text-blue-500 ml-1";
      } else {
        DOM.dayOfWeek.className = "text-xs font-medium text-gray-500 ml-1";
      }
    }
    function changeDate(offset) {
      currentDate.setDate(currentDate.getDate() + offset);
      updateDateUI();
      loadMealData(currentDate);
    }
    function goToday() {
      currentDate = new Date();
      updateDateUI();
      loadMealData(currentDate);
    }
    function formatMeal(dishStr) {
      if (!dishStr) return '<span class="text-gray-400">급식 정보가 없습니다.</span>';
      const dishes = dishStr.split(BR_SPLIT_REGEX);
      let html = '';
      for (let i = 0; i < dishes.length; i++) {
        const clean = dishes[i].replace(ALLERGEN_REGEX, '').trim();
        if (clean) {
          html += `<div class="py-0.5">• ${clean}</div>`;
        }
      }
      return html || '<span class="text-gray-400">급식 정보가 없습니다.</span>';
    }
    function renderMealData(dayData) {
      if (!dayData) {
        DOM.lunchElem.innerHTML = '<span class="text-gray-400">중식 정보가 없습니다.</span>';
        DOM.dinnerElem.innerHTML = '<span class="text-gray-400">석식 정보가 없습니다.</span>';
        DOM.calLunchElem.innerText = '';
        DOM.calDinnerElem.innerText = '';
        return;
      }
      if (dayData.lunch && dayData.lunch.DDISH_NM) {
        DOM.lunchElem.innerHTML = formatMeal(dayData.lunch.DDISH_NM);
        DOM.calLunchElem.innerText = dayData.lunch.CAL_INFO || '';
      } else {
        DOM.lunchElem.innerHTML = '<span class="text-gray-400">중식 정보가 없습니다.</span>';
        DOM.calLunchElem.innerText = '';
      }
      if (dayData.dinner && dayData.dinner.DDISH_NM) {
        DOM.dinnerElem.innerHTML = formatMeal(dayData.dinner.DDISH_NM);
        DOM.calDinnerElem.innerText = dayData.dinner.CAL_INFO || '';
      } else {
        DOM.dinnerElem.innerHTML = '<span class="text-gray-400">석식 정보가 없습니다.</span>';
        DOM.calDinnerElem.innerText = '';
      }
    }
    async function loadMealData(dateObj) {
      const dateStr = getYYYYMMDD(dateObj);
      const prevStr = getYYYYMMDD(getOffsetDate(dateObj, -1));
      const nextStr = getYYYYMMDD(getOffsetDate(dateObj, 1));
      if (mealCache.has(dateStr)) {
        renderMealData(mealCache.get(dateStr));
        if (!mealCache.has(prevStr) || !mealCache.has(nextStr)) {
          fetchRangeData(prevStr, nextStr, false);
        }
        return;
      }
      DOM.lunchElem.innerHTML = getSkeletonHTML();
      DOM.dinnerElem.innerHTML = getSkeletonHTML();
      DOM.calLunchElem.innerText = '';
      DOM.calDinnerElem.innerText = '';
      await fetchRangeData(prevStr, nextStr, true, dateStr);
    }
    async function fetchRangeData(fromYmd, toYmd, renderTarget = false, targetYmd = '') {
      if (currentAbortController) {
        currentAbortController.abort();
      }
      currentAbortController = new AbortController();
      try {
        const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?ATPT_OFCDC_SC_CODE=C10&SD_SCHUL_CODE=7150118&MLSV_FROM_YMD=${fromYmd}&MLSV_TO_YMD=${toYmd}&pSize=100&Type=json`;
        const response = await fetch(url, { signal: currentAbortController.signal });
        const jsonData = await response.json();
        let curr = new Date(
          parseInt(fromYmd.substring(0, 4)),
          parseInt(fromYmd.substring(4, 6)) - 1,
          parseInt(fromYmd.substring(6, 8))
        );
        const endDate = new Date(
          parseInt(toYmd.substring(0, 4)),
          parseInt(toYmd.substring(4, 6)) - 1,
          parseInt(toYmd.substring(6, 8))
        );
        while (curr <= endDate) {
          const key = getYYYYMMDD(curr);
          if (!mealCache.has(key)) {
            mealCache.set(key, { lunch: null, dinner: null });
          }
          curr.setDate(curr.getDate() + 1);
        }
        if (jsonData['mealServiceDietInfo'] && jsonData['mealServiceDietInfo'][1] && jsonData['mealServiceDietInfo'][1]['row']) {
          const rows = jsonData['mealServiceDietInfo'][1]['row'];
          for (let i = 0; i < rows.length; i++) {
            const item = rows[i];
            const ymd = item.MLSV_YMD;
            let entry = mealCache.get(ymd);
            if (!entry) {
              entry = { lunch: null, dinner: null };
            }
            const code = String(item.MMEAL_SC_CODE || '').trim();
            const name = String(item.MMEAL_SC_NM || '').trim();
            if (code === '2' || name.includes('중식')) {
              entry.lunch = item;
            }
            if (code === '3' || name.includes('석식')) {
              entry.dinner = item;
            }
            mealCache.set(ymd, entry);
          }
        }
        if (renderTarget && targetYmd) {
          renderMealData(mealCache.get(targetYmd));
        }
      } catch (err) {
        if (err.name === 'AbortError') return;
        console.error(err);
        if (renderTarget && targetYmd) {
          DOM.lunchElem.innerHTML = '<span class="text-gray-400">불러오기 실패</span>';
          DOM.dinnerElem.innerHTML = '<span class="text-gray-400">불러오기 실패</span>';
        }
      }
    }
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') changeDate(-1);
      if (e.key === 'ArrowRight') changeDate(1);
    });
    window.onload = function () {
      DOM = {
        dateDisplay: document.getElementById('dateDisplay'),
        dayOfWeek: document.getElementById('dayOfWeek'),
        lunchElem: document.getElementById('m'),
        dinnerElem: document.getElementById('n'),
        calLunchElem: document.getElementById('cal-lunch'),
        calDinnerElem: document.getElementById('cal-dinner')
      };
      updateDateUI();
      loadMealData(currentDate);
    };
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log("서비스 워커 등록"))
        .catch(err => console.log("등록 실패:", err));
    }
  </script>
</body>

</html>
